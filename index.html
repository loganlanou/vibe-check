<script>(async()=>{
  async function decode(id){const b=Uint8Array.from(atob(document.getElementById(id).textContent.trim()),c=>c.charCodeAt(0));return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate'))).text()}
  try {const [css,code]=await Promise.all([decode('vc-css'),decode('vc-js')]);const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);new Function(code)();}
  catch(err){console.error('Vibe Check demo failed to initialize',err);document.getElementById('app').innerHTML='<p style="color:white;background:#171226;padding:24px;font-family:sans-serif">Unable to initialize Vibe Check. Please use a modern browser.</p>'}
})()</script></body></html>
